
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Socket.IO Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ddd;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .chat {
            width: 450px;
            height: 600px;

            background: #efeae2;

            display: flex;
            flex-direction: column;

            border-radius: 10px;
            overflow: hidden;
        }

        /* Header */

        .header {
            background: #075e54;
            color: white;

            padding: 15px;

            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            background: white;
            color: #075e54;

            display: flex;
            justify-content: center;
            align-items: center;

            font-weight: bold;
        }

        .user-name {
            font-weight: bold;
        }

        .status {
            font-size: 12px;
            margin-top: 3px;
        }

        /* Messages */

        .messages {
            flex: 1;

            padding: 15px;

            overflow-y: auto;
        }

        .message {
            width: fit-content;
            max-width: 70%;

            padding: 8px 12px;

            margin-bottom: 8px;

            background: white;

            border-radius: 8px;
        }

        .my-message {
            margin-left: auto;
            background: #d9fdd3;
        }

        /* Input */

        .input-area {
            padding: 10px;

            background: #f0f0f0;

            display: flex;
            gap: 8px;
        }

        .input {
            flex: 1;

            padding: 12px;

            border: none;
            outline: none;

            border-radius: 20px;

            font-size: 14px;
        }

        .send-button {
            width: 45px;
            height: 45px;

            border: none;
            border-radius: 50%;

            background: #128c7e;
            color: white;

            cursor: pointer;

            font-size: 18px;
        }

        .typing {
            display: none;

            padding: 5px 15px;

            font-size: 12px;
            font-style: italic;

            color: #666;
        }
    </style>
</head>

<body>

    <div class="chat">

        <!-- Header -->

        <div class="header">

            <div class="avatar">
                R
            </div>

            <div>
                <div class="user-name">
                    Chat User
                </div>

                <div class="status">
                    Online
                </div>
            </div>

        </div>


        <!-- Messages -->

        <div class="messages" id="messages">
        </div>


        <!-- Typing indicator -->

        <div class="typing" id="typing">
            Someone is typing...
        </div>


        <!-- Input -->

        <div class="input-area">

            <input
                id="messageInput"
                class="input"
                type="text"
                placeholder="Type a message..."
            >

            <button
                id="sendButton"
                class="send-button"
            >
                ➤
            </button>

        </div>

    </div>


    <!-- Socket.IO client -->

    <script src="/socket.io/socket.io.js"></script>

    <script>

        // Connect to Socket.IO server

        const socket = io();


        // Get HTML elements

        const messages = document.getElementById("messages");

        const input = document.getElementById("messageInput");

        const sendButton = document.getElementById("sendButton");

        const typing = document.getElementById("typing");


        // --------------------------------
        // RECEIVE MESSAGE
        // --------------------------------

        socket.on("server:message", (data) => {

            addMessage(data.message, false);

        });


        // --------------------------------
        // RECEIVE TYPING EVENT
        // --------------------------------

        socket.on("server:typing", () => {

            typing.style.display = "block";

            setTimeout(() => {

                typing.style.display = "none";

            }, 1000);

        });


        // --------------------------------
        // ADD MESSAGE TO SCREEN
        // --------------------------------

        function addMessage(message, mine) {

            const messageElement = document.createElement("div");

            messageElement.classList.add("message");

            if (mine) {
                messageElement.classList.add("my-message");
            }

            messageElement.innerText = message;

            messages.appendChild(messageElement);

            // Scroll to bottom

            messages.scrollTop = messages.scrollHeight;
        }


        // --------------------------------
        // SEND MESSAGE
        // --------------------------------

        function sendMessage() {

            const message = input.value.trim();

            // Don't send empty messages

            if (message === "") {
                return;
            }


            // Send message to server

            socket.emit("user:message", {
                message: message
            });


            // Show our own message

            addMessage(message, true);


            // Clear input

            input.value = "";
        }


        // --------------------------------
        // SEND BUTTON
        // --------------------------------

        sendButton.addEventListener("click", () => {

            sendMessage();

        });


        // --------------------------------
        // ENTER KEY
        // --------------------------------

        input.addEventListener("keydown", (event) => {

            if (event.key === "Enter") {

                sendMessage();

            }

        });


        // --------------------------------
        // TYPING EVENT
        // --------------------------------

        input.addEventListener("input", () => {

            socket.emit("user:typing");

        });

    </script>

</body>

</html>
