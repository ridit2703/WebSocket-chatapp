<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chatt App</title>
</head>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #ddd;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .chat {
        width: 450px;
        height: 650px;
        background: #efeae2;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 10px;
    }

    /* Header */

    .header {
        background: #075e54;
        color: white;
        padding: 15px;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .avatar {
        width: 40px;
        height: 40px;
        background: #ddd;
        color: #555;
        border-radius: 50%;

        display: flex;
        justify-content: center;
        align-items: center;

        font-weight: bold;
    }

    .typing {
        font-size: 12px;
        color: #d9fdd3;
        font-style: italic;
        margin-top: 2px;
    }

    .user-name {
        font-size: 16px;
        font-weight: bold;
    }

    .online {
        font-size: 12px;
        margin-top: 3px;
    }

    /* Messages */

    .messages {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
    }

    .message {
        width: fit-content;
        max-width: 70%;
        padding: 8px 12px;
        margin-bottom: 8px;
        border-radius: 8px;
        background: white;
        font-size: 14px;
    }

    .my-message {
        margin-left: auto;
        background: #d9fdd3;
    }

    /* Input */

    .input-area {
        background: #f0f0f0;
        padding: 10px;
        display: flex;
        gap: 8px;
    }

    .input {
        flex: 1;
        border: none;
        outline: none;
        padding: 12px;
        border-radius: 20px;
        font-size: 14px;
    }

    .send {
        width: 45px;
        height: 45px;
        border: none;
        border-radius: 50%;
        background: #128c7e;
        color: white;
        cursor: pointer;
        font-size: 18px;
    }
</style>

<body>
    <h1>hello</h1>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io()

        socket.on("connect", () => {
            console.log("connected", socket.id)

        })

        //main chat container
        const chat = document.createElement("div");
        chat.className = "chat";

        //header
        const header = document.createElement("div")
        header.className = "header";
        const avatar = document.createElement("div")
        avatar.className = "avatar";
        avatar.innerText = "User";

        const userInfo = document.createElement("div");

        const userName = document.createElement("div");
        userName.className = "user-name";
        userName.innerText = "Chat-User";

        const online = document.createElement("div");
        online.className = "online";
        online.innerText = "online";

        //message container
        const messages = document.createElement("div");
        messages.className = "message";


        //input area
        const inputArea = document.createElement("div");
        inputArea.className = "input-area";

        const input = document.createElement("input");
        input.className = "input";
        input.placeholder = "Type a message...";

        const sendButton = document.createElement("button");
        sendButton.className = "send";
        sendButton.innerText = "➤";

        inputArea.append(input, sendButton);

        //add every to chat

        chat.append(
            header,
            messages,
            inputArea
        )
        document.body.append(chat);

        //add message to chat
        function addMessage(message, mine = true) {

            const messageElement = document.createElement("div")
            messageElement.className = "message";

            if (mine) {
                messageElement.classList.add("my-message");
            }
            messageElement.innerText = message;
            messages.append(messageElement)

            //automatically scroll to bottom
            messages.scrollTop = messages.scrollHeight;


        }

        // Send message
        function sendMessage() {

            const message = input.value.trim();

            if (!message) {
                return;
            }

            socket.emit('user:message', { message })

            addMessage(message);

            input.value = "";
        }

        // Button click
        sendButton.addEventListener("click", sendMessage);

          // Enter key
        input.addEventListener("keydown", (event) => {

            if (event.key === "Enter") {
                sendMessage();
            }

        });

    </script>
</body>

</html>
